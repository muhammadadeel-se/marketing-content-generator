<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Content Generator - TaskFlow Software</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">TaskFlow Marketing Generator</h3>
                    </div>
                    <div class="card-body">
                        {% if error_message %}
                            <div class="alert alert-danger" role="alert">
                                {{ error_message }}
                            </div>
                        {% endif %}

                        <form method="POST" action="/">
                            <div class="mb-3">
                                <label for="product_name" class="form-label">Product Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="product_name" name="product_name" placeholder="e.g. TaskFlow Planner" required>
                            </div>

                            <div class="mb-3">
                                <label for="key_features" class="form-label">Key Features <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="key_features" name="key_features" rows="3" placeholder="e.g. AI auto-scheduling, Kanban boards, Slack integration" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="target_audience" class="form-label">Target Audience <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="target_audience" name="target_audience" placeholder="e.g. Software engineers, Project managers" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Generate Marketing Copy</button>
                        </form>
                    </div>
                </div>

                {% if copy_result %}
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">Generated Copy Output</h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <h5>Headline</h5>
                                <p class="lead fw-bold text-dark">{{ copy_result.headline }}</p>
                            </div>
                            <hr>
                            <div class="mb-3">
                                <h5>Tagline</h5>
                                <p class="fst-italic text-secondary">{{ copy_result.tagline }}</p>
                            </div>
                            <hr>
                            <div class="mb-3">
                                <h5>Body Copy</h5>
                                <p class="card-text">{{ copy_result.body }}</p>
                            </div>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
